<template>
    <div class="flipswitch-admin">

        <!-- Kill-switch alert banner -->
        <template lwc:if={hasKillSwitchedFlags}>
            <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                <span class="slds-assistive-text">Error</span>
                <lightning-icon
                    icon-name="utility:error"
                    alternative-text="Error"
                    size="x-small"
                    class="slds-m-right_x-small">
                </lightning-icon>
                <h2>
                    {killSwitchedCount} flag(s) are currently kill-switched.
                    <a onclick={handleKillSwitchBannerClick} class="slds-alert__close-link">
                        View affected flags
                    </a>
                </h2>
            </div>
        </template>

        <!-- Org health summary strip -->
        <div class="slds-grid slds-gutters slds-m-bottom_medium health-strip">
            <div class="slds-col">
                <div class="health-tile health-tile_active">
                    <span class="health-tile__count">{orgHealth.totalActive}</span>
                    <span class="health-tile__label">Active Flags</span>
                </div>
            </div>
            <div class="slds-col">
                <div class="health-tile health-tile_warning">
                    <span class="health-tile__count">{orgHealth.expiringSoon}</span>
                    <span class="health-tile__label">Expiring This Week</span>
                </div>
            </div>
            <div class="slds-col">
                <div class="health-tile health-tile_danger">
                    <span class="health-tile__count">{orgHealth.killSwitched}</span>
                    <span class="health-tile__label">Kill-Switched</span>
                </div>
            </div>
            <div class="slds-col">
                <div class="health-tile health-tile_neutral">
                    <span class="health-tile__count">{orgHealth.circuitBreakers}</span>
                    <span class="health-tile__label">Circuit Breaker Trips</span>
                </div>
            </div>
        </div>

        <!-- Main tab container -->
        <lightning-tabset active-tab-value={activeTab} onactive={handleTabChange}>

            <!-- ── Dashboard tab ── -->
            <lightning-tab label="Dashboard" value="dashboard" icon-name="utility:layers">
                <c-feature-flag-dashboard
                    active-tab={activeTab}
                    onviewflag={handleViewFlag}
                    onkillswitchtoggled={handleKillSwitchToggled}>
                </c-feature-flag-dashboard>
            </lightning-tab>

            <!-- ── Flag detail / rules tab ── -->
            <lightning-tab label="Flag Detail" value="detail" icon-name="utility:settings">
                <template lwc:if={selectedFlagKey}>
                    <c-feature-flag-detail
                        flag-key={selectedFlagKey}
                        onruleedit={handleRuleEdit}
                        onkillswitchtoggled={handleKillSwitchToggled}>
                    </c-feature-flag-detail>
                </template>
                <template lwc:else>
                    <div class="slds-illustration slds-illustration_small slds-m-top_large">
                        <div class="slds-illustration__figure">
                            <lightning-icon
                                icon-name="utility:info"
                                size="large"
                                class="slds-illustration__svg">
                            </lightning-icon>
                        </div>
                        <div class="slds-illustration__body">
                            <h3 class="slds-text-heading_medium">No Flag Selected</h3>
                            <p class="slds-text-body_regular">
                                Select a flag from the Dashboard tab to view its details.
                            </p>
                        </div>
                    </div>
                </template>
            </lightning-tab>

            <!-- ── Evaluation logs tab ── -->
            <lightning-tab label="Eval Logs" value="logs" icon-name="utility:activity">
                <c-feature-flag-eval-logs
                    flag-key={selectedFlagKey}>
                </c-feature-flag-eval-logs>
            </lightning-tab>

            <!-- ── Analytics tab ── -->
            <lightning-tab label="Analytics" value="analytics" icon-name="utility:chart">
                <c-feature-flag-analytics
                    flag-key={selectedFlagKey}>
                </c-feature-flag-analytics>
            </lightning-tab>

        </lightning-tabset>

    </div>
</template>

name: Build

env:
  SF_DISABLE_AUTOUPDATE: true
  SF_SKIP_NEW_VERSION_CHECK: true

on:
  push:
    branches: [main]
    paths:
      - 'flipswitch/**'
      - '.github/workflows/**'
      - 'config/scratch-orgs/**'
      - 'sfdx-project.json'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'flipswitch/**'
      - '.github/workflows/**'
      - 'config/scratch-orgs/**'
      - 'sfdx-project.json'

jobs:
  # ─── Stage 1: Code Quality ─────────────────────────────────────────────────
  code-quality:
    name: 'Run Code Quality Tests'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout source code'
        uses: actions/checkout@v4

      - name: 'Setup Node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 'Restore node_modules cache'
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-

      - name: 'Install npm dependencies'
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: 'Verify LWC with ESLint'
        run: npm run lint

      - name: 'Verify formatting with Prettier'
        run: npm run prettier:verify

  # ─── Stage 2: LWC Jest Tests ───────────────────────────────────────────────
  lwc-tests:
    name: 'Run LWC Jest Tests'
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout source code'
        uses: actions/checkout@v4

      - name: 'Setup Node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 'Restore node_modules cache'
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-

      - name: 'Install npm dependencies'
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: 'Run LWC Tests'
        run: npm run test:lwc

      - name: 'Upload LWC code coverage to Codecov'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          flags: LWC
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── Stage 3: Apex Tests (Base Scratch Org) ────────────────────────────────
  base-scratch-org-tests:
    name: 'Run Base Scratch Org Tests'
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout source code'
        uses: actions/checkout@v4

      - name: 'Setup Node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 'Restore node_modules cache'
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-

      - name: 'Install npm dependencies'
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: 'Authenticate DevHub'
        run: |
          echo "${{ secrets.SF_AUTH_URL }}" > ./auth-url.txt
          npx sf org login sfdx-url --sfdx-url-file ./auth-url.txt --alias devhub --set-default-dev-hub
          rm ./auth-url.txt

      - name: 'Create Scratch Org'
        run: npx sf org create scratch --no-namespace --no-track-source --duration-days 1 --definition-file ./config/scratch-orgs/base-scratch-def.json --wait 20 --set-default --json

      # Deploy only the core directory first and run all tests as part of the deployment
      # This ensures the core package has sufficient code coverage on its own
      - name: 'Validate Core Source in Scratch Org'
        run: npx sf project deploy validate --concise --source-dir ./flipswitch/core/ --test-level RunLocalTests

      - name: 'Deploy All Source to Scratch Org'
        run: npx sf project deploy start --source-dir ./flipswitch/

      - name: 'Assign Permission Sets'
        run: npm run permset:assign:all

      - name: 'Run Apex Tests Asynchronously'
        run: npm run test:apex:nocoverage

      - name: 'Run Apex Tests Synchronously'
        run: npm run test:apex:nocoverage -- --synchronous

      - name: 'Get Core Test Code Coverage'
        run: npm run test:apex

      - name: 'Upload Apex code coverage to Codecov'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          flags: Apex
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 'Delete Scratch Org'
        run: npx sf org delete scratch --no-prompt
        if: ${{ always() }}

  # ─── Stage 4: Create Package Version (main only) ───────────────────────────
  create-package-version:
    name: 'Create Package Version'
    needs: [lwc-tests, base-scratch-org-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout source code'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 'Setup Node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 'Restore node_modules cache'
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-

      - name: 'Install npm dependencies'
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: 'Authenticate DevHub'
        run: |
          echo "${{ secrets.SF_AUTH_URL }}" > ./auth-url.txt
          npx sf org login sfdx-url --sfdx-url-file ./auth-url.txt --alias devhub --set-default-dev-hub
          rm ./auth-url.txt

      - name: 'Create Package Version'
        id: create-version
        run: |
          RESULT=$(npm run package:version:create 2>&1)
          echo "$RESULT"
          VERSION_ID=$(echo "$RESULT" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['result']['SubscriberPackageVersionId'])" 2>/dev/null || echo "")
          echo "version_id=$VERSION_ID" >> $GITHUB_OUTPUT

      - name: 'Promote Package Version'
        if: steps.create-version.outputs.version_id != ''
        run: npx sf package version promote --no-prompt --package "${{ steps.create-version.outputs.version_id }}"
